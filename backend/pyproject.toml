[project]
name = "meditacao-diaria-backend"
version = "0.1.0"
description = "Backend FastAPI para Meditação Diária"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "beautifulsoup4",
    "requests",
    "apscheduler",
    "deepl",
    "python-dotenv",
    "pydantic-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
